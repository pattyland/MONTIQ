# Example configuration for montiq.sh
# Required settings are left uncommented. Optional ones stay commented out
# so you can enable only what you need.

# --- Required broker settings -------------------------------------------------
MQTT_HOST="mqtt.example.lan"
#MQTT_PORT=1883

# --- Optional authentication --------------------------------------------------
#MQTT_USERNAME="your-user"
#MQTT_PASSWORD="your-password"
#MQTT_CLIENT_ID="montiq-edge-node" # defaults to montiq-${NODE_ID}

# --- Optional TLS configuration ----------------------------------------------
#MQTT_USE_TLS=true
#MQTT_CA_FILE="/etc/ssl/certs/ca.crt"
#MQTT_CERT_FILE="/etc/ssl/certs/client.crt"
#MQTT_KEY_FILE="/etc/ssl/private/client.key"

# --- MQTT topics & Home Assistant metadata -----------------------------------
#NODE_ID="edge_zero"             # defaults to sanitized hostname; normalized for MQTT/HA IDs
#DEVICE_MODEL="CM4 Board"        # defaults to detected hardware model or "Unknown Model"
#STATE_BASE_PREFIX="homeassistant"
#DISCOVERY_PREFIX="homeassistant"
#RETAIN_DISCOVERY_MESSAGES=true

#ENABLE_CPU_SENSOR=true
#ENABLE_VOLTAGE_SENSOR=true
#ENABLE_LOAD_SENSOR=true
#ENABLE_UPTIME_SENSOR=true
#ENABLE_MEMORY_SENSOR=true
#ENABLE_DISK_SENSOR=true
#DISK_PATH="/" # defaults to / on Linux, /System/Volumes/Data on macOS
